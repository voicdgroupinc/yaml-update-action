  exposure: ''
  nodeGroup: any
  gpu:
    enabled: true
  resources:
    limits:
      cpu: 4000m
      memory: 18Gi
      # Bounds the pod's own disk use so a runaway cache evicts this pod instead
      # of pushing the whole node past the kubelet threshold and taking its
      # neighbours with it (ARCH-602).
      ephemeral-storage: 8Gi
    requests:
      cpu: 2000m
      memory: 2Gi
      # Without this the scheduler sees "ephemeral-storage 0 (0%)" and will pack
      # replicas onto a node that has no disk left for them.
      ephemeral-storage: 2Gi
  image:
    repository: image-registry.openshift-image-registry.svc:5000/voicdops-images/modelagent
    tag: v1.0.115
    pullPolicy: Always
  service:
    port: 8080
    targetPort: 8080
  filestore:
    localvaultName: ''
    mountPath: /app/filestore
    # Where the model cache lives. HF_HOME sits under this mount and each
    # replica pulls ~12 GiB into it, so on a 4-replica GPU node an emptyDir put
    # ~48 GiB on the node's 99 GiB disk and the kubelet evicted a pod for
    # ephemeral-storage pressure (ARCH-602). A generic ephemeral volume gives
    # each replica its own PVC with the pod's lifetime -- same
    # create-and-destroy semantics as the emptyDir, but the cache never touches
    # the node's disk. Ignored when localvaultName pins a shared claim.
    ephemeral:
      enabled: true
      size: 20Gi
      # Empty means the cluster default StorageClass.
      storageClassName: ''
  models:
    s3Endpoint: ''
  route:
    routeName: c111-e.us-east.containers.cloud.ibm.com
