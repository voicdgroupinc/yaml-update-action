rsearch:
  enabled: false
  image:
    repository: image-registry.openshift-image-registry.svc:5000/voicdops-images/rsearch
    tag: git-f62e51dfac49bf066f77450febd3eaa9022a6866
    pullPolicy: Always
  replicas: 3
  pvc:
    size: 150Gi
    storageClass: ibmc-vpc-block-10iops-tier
  resources:
    requests:
      cpu: '2'
      memory: 4Gi
    limits:
      cpu: '8'
      memory: 16Gi
  cluster:
    replicationFactor: 2
    writeQuorum: 0
  search:
    cacheMaxMb: 8192
  ingest:
    memoryBudgetMb: 256
    maxBatchDocs: 100000
    balanceBulk: true
  control:
    # Merge target (#49): splits below this keep merging and each group is
    # cut once it crosses, so outputs leave the candidate set. Replaces the
    # deprecated mergeMinMb, which was a ceiling and let 68 MB archive
    # flushes accumulate forever. Group of 8 crosses 512 MB in one pass.
    mergeTargetMb: 512
    mergeMaxGroup: 8
  inputs:
    syslog:
      enabled: false
    gelf:
      enabled: false
  route:
    timeout: 60s
  monitoring:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    credentialsSecret: rsearch-vector-credentials
    alerts:
      enabled: true
      queueDepth: 25000
      walOutstanding: 50000
      memoryHighRatio: 0.85
      memoryCriticalRatio: 0.95
      volumeFreeRatio: 0.15
  metastore:
    secretName: rsearch-postgresql
  # Automatic user bootstrap (templates/rsearch/bootstrap-users-job.yaml).
  #
  # OFF by default so every existing deployment renders unchanged. Turning it on
  # closes rSearch's bootstrap window automatically instead of relying on someone
  # running the runbook curl commands: until a first user exists, EVERY endpoint
  # is unauthenticated full-admin, on a cluster where the API Route already
  # exists.
  #
  # Requires an out-of-band Secret (never in git) with `admin-password` and
  # `service-password`:
  #   oc create secret generic rsearch-bootstrap -n <ns> \
  #     --from-literal=admin-password="$(openssl rand -base64 24)" \
  #     --from-literal=service-password="$(openssl rand -base64 24)"
  #
  # serviceUser defaults to `elastic` on purpose: PVITL's
  # config/initializers/elasticsearch.rb hardcodes `user: 'elastic'` and reads
  # only ELASTIC_PASSWORD, so renaming it would need an app change.
  bootstrap:
    enabled: false
    secretName: rsearch-bootstrap
    serviceUser: elastic
  postgresql:
    image: docker.io/library/postgres:18.3-alpine
    storage: 20Gi
    storageClass: ibmc-vpc-block-10iops-tier
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
  ui:
    enabled: true
    image:
      repository: image-registry.openshift-image-registry.svc:5000/voicdops-images/rsearch-ui
      tag: git-f62e51dfac49bf066f77450febd3eaa9022a6866
      pullPolicy: Always
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    route:
      timeout: 60s
  archive:
    enabled: false
    bucket: voicdops-logs-archive-us-east-1
    endpoint: https://s3.direct.us-east.cloud-object-storage.appdomain.cloud
    region: us-east
    secretName: rsearch-cos-archive
    ingest:
      memoryBudgetMb: 128
      queueCapacity: 20000
    pvc:
      size: 50Gi
      storageClass: ibmc-vpc-block-10iops-tier
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '4'
        memory: 12Gi
