streamchannel:
  enabled: false
  nodeGroup: ''
  mode: intra
  replicaCount: 1
  image:
    repository: image-registry.openshift-image-registry.svc:5000/voicdops-images/streamchannel
    tag: v0.1.8
    pullPolicy: Always
  resources:
    limits:
      cpu: '4'
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  auth:
    # The QueueBroker a_token, consumed as a secretKeyRef (SC_A_TOKEN) — never a
    # chart value, so it does not land in git. The chart renders no Secret: for an
    # OpsPortal-managed deployment OpsPortal pushes it into the namespace, the same
    # split as datavault-storage and rabbitmq-keda. A hand-written overlay (e.g.
    # corporate/dev-lakehouse) must create it by hand, or streamchannel sits in
    # CreateContainerConfigError and holds up the sync (ARCH-638).
    aTokenSecret: streamchannel-atoken
    aTokenSecretKey: a-token
  queuebroker:
    host: queuebroker
    port: 8080
  rabbitmq:
    host: rabbitmq
    port: 5672
  extra:
    queuebroker:
