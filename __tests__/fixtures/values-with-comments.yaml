# Shared bits rendered into every deployment namespace.
general:
  ibmCloudSecret:
    # The `ibm-cloud` Secret (templates/general/secret.yaml). Default true purely
    # to preserve existing behaviour — it holds IBM COS credentials committed to
    # git and is consumed by nothing. Set false for any deployment that must not
    # hold production credentials.
    enabled: true
defaultNodeGroup: general
nodeGroups:
  any: {}
  general:
    avoidGpuNodes: true
  voicd-services:
    nodeSelector:
      voicd.app/node-group: voicd-services
    tolerations:
      - key: voicd.app/node-group
        operator: Equal
        value: voicd-services
        effect: NoSchedule
  gpu:
    nodeSelector:
      voicd.app/node-group: gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: 'true'
        effect: NoSchedule
    gpuCount: 1
  # ARCH-557: GPU pools that differ only in how much VRAM one nvidia.com/gpu
  # slot is worth. Time-slicing splits a card into N schedulable slots with NO
  # memory isolation, so the split IS the per-pod budget — pick the pool by what
  # the workload needs to keep resident:
  #
  #   gpu          1x L4   24GB / 4   ->  4 slots/node, ~5.6 GiB per slot
  #   gpu-2l4-2    2x L4   24GB / 2   ->  4 slots/node, ~11.25 GiB per slot
  #   gpu-l40s-4   1x L40S 48GB / 4   ->  4 slots/node, ~11.25 GiB per slot
  #   gpu-l40s-2   1x L40S 48GB / 2   ->  2 slots/node, ~22.5 GiB per slot
  #
  # The slot count is per physical card, not per node, which is why the 2x L4
  # profile at a 2-way split lands on the same slot size as the 1x L40S at a
  # 4-way split — gpu-2l4-2 is the L4-priced twin of gpu-l40s-4, and a usable
  # fallback when L40S spot capacity is not available in a zone.
  #
  # The boundaries come from measurement (ARCH-558 — every ModelAgent job type
  # probed at 5ms through the real analyzer path), not from round numbers.
  # Peak MiB at 60s of audio, including a ~609 MiB CUDA context:
  #
  #   A_SA_SUITE (full ASR stack)  14,823   -> gpu-l40s-2 only
  #   A_ER_EMOTION_RECOG           10,224   -> ~11 GiB slot, with little to spare
  #   A_SA_ASR_WHISPERX             8,657   -> ~11 GiB slot
  #   A_SA_ASR_WHISPER              7,509   -> ~11 GiB slot
  #   A_DF_DEEPFAKE_DETECTION       3,197   -> the 5.6 GiB `gpu` pool is right
  #   A_SV_* speaker verification   1,823-2,199
  #
  # So `gpu` is not obsolete: deepfake and speaker verification are what prod
  # actually serves today, and putting them in an 11 GiB slot wastes most of it.
  #
  # Two traps when sizing against that table. ModelAgent never releases a loaded
  # model (global.cleanup_model_memory is false), so a pod serving several job
  # types holds the SUM of their footprints — size against the job types routed
  # to the pool. And A_ER_EMOTION_RECOG grows ~3.7x per doubling of clip length
  # (no chunking, eager attention — ARCH-563), so its 10,224 MiB figure holds at
  # 60s and not beyond; a 120s clip does not fit any slot here.
  #
  # The nvidia.com/device-plugin.config selector is doing real work, not
  # decoration: it is the label the GPU operator reads to decide which slicing
  # profile a node runs, and OpsPortal applies each pool's labels FROM this same
  # nodeSelector map. Emitting it on the pod as well is what guarantees a pod
  # cannot land on a node running the other split. Keep the two in step with the
  # keys in the device-plugin ConfigMap (ai-accelerator, gpu-operator-certified
  # instance base) — a selector naming a profile that does not exist there
  # leaves pods Pending against nodes whose device plugin never came up.
  gpu-l40s-4:
    nodeSelector:
      voicd.app/node-group: gpu-l40s-4
      nvidia.com/device-plugin.config: time-sliced-4
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: 'true'
        effect: NoSchedule
    gpuCount: 1
  gpu-l40s-2:
    nodeSelector:
      voicd.app/node-group: gpu-l40s-2
      nvidia.com/device-plugin.config: time-sliced-2
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: 'true'
        effect: NoSchedule
    gpuCount: 1
  gpu-2l4-2:
    nodeSelector:
      voicd.app/node-group: gpu-2l4-2
      nvidia.com/device-plugin.config: time-sliced-2
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: 'true'
        effect: NoSchedule
    gpuCount: 1
