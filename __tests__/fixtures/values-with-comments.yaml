    rabbitmq:
      host: ''
    aTokenSecret: streamchannel-extra-atoken
    aTokenSecretKey: a-token
  ingest:
    rtpPort: 30000
    healthPort: 8080
  uidScope: channel
  segmentation:
    targetMs: 5000
    minMs: 3000
    maxMs: 12000
    silenceHangoverMs: 240
    tailFloorMs: 1000
    vad: webrtc
    vadThreshold: 0.4
  backpressure:
    policy: buffer
    sampleEveryN: 2
  retention:
    segmentTtlSeconds: 3600
    sweepIntervalSeconds: 300
  channels: []
  sidecars:
    datavault:
      enabled: true
      image: image-registry.openshift-image-registry.svc:5000/voicdops-images/datavault-sidecar
      tag: latest
      pullPolicy: Always
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
      socketPath: /shared/ipc/datavault.sock
      args:
        - '--ipc-mode'
        - '--ipc-socket-path'
        - /shared/ipc/datavault.sock
        - '--filestore-base-path'
        - /app/filestore
        - '--filestore-vault-dir'
        - vault
        - '--filestore-temp-dir'
        - /app/filestore/tmp
  filestore:
    localvaultName: ''
    mountPath: /app/filestore
  siprec:
    # SIPREC is StreamChannel Phase 2 and nothing runs it yet — dev-lakehouse turns
    # it off explicitly, pvitl-uat has streamchannel off entirely. Left on, it is
    # gated only on `streamchannel.enabled`, so enabling the component brings up
    # drachtio (SIP, expose: public), srs-app, rtpengine on hostNetwork and a
    # LoadBalancer Service for SIP — a billed public IP per namespace. That was
    # tolerable while streamchannel was off everywhere; it is not now that OpsPortal
    # enables it by default (ARCH-625). Opt in per deployment when SIP is wanted.
    enabled: false
    drachtio:
      image: drachtio/drachtio-server
      tag: latest
      pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
      sipPort: 5060
      adminPort: 9022
      secretRef: streamchannel-drachtio
      expose: public
    srsApp:
      image: image-registry.openshift-image-registry.svc:5000/voicdops-images/streamchannel-srs
      tag: v0.1.0
      pullPolicy: Always
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    rtpengine:
      enabled: true
      image: image-registry.openshift-image-registry.svc:5000/voicdops-images/rtpengine
      tag: latest
      pullPolicy: IfNotPresent
      replicaCount: 1
      hostNetwork: true
      serviceAccount: streamchannel-rtpengine
      portMin: 30000
      portMax: 40000
      ngPort: 22222
      # What rtpengine advertises in SDP. Empty = the node's own address, which
      # is wrong behind NAT: the call sets up and then carries no audio. Media
      # rides hostNetwork on portMin-portMax to the node, NEVER the SIP LB (the
      # LB listens only on 5060, and VPC NLB has no port-range listeners), so
      # this and the VPC rules are the whole media path. OpsPortal refuses to
      # publish SIP without it (ARCH-626).
      #
      # ARCH-632: set this to the FLOATING IP attached to the rtpengine node.
      # rtpengine binds $(NODE_IP) and advertises this (bind!advertise) — it is
      # never bound, so a NAT'd FIP is fine. Riders: the FIP lives on one node,
      # so the pod must be pinned there and replicaCount must stay 1; that
      # node's security group needs portMin-portMax/udp open. On-VPC/private
      # callers need none of this — leave it empty and the node IP is correct.
      publicAddress: ''
      resources:
        limits:
          cpu: '2'
          memory: 1Gi
        requests:
          cpu: 250m
          memory: 256Mi
