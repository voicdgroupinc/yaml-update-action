routes:
  domains: []
  domain: ''
  defaultDomain: ''
  internalDomain: ''
  externalTarget: ''
  hstsHeader: max-age=31536000
  defaultExposure: internal
  # ARCH-568: whether a public route's Cloudflare record is PROXIED (orange
  # cloud) rather than DNS-only. A cluster-wide fact — it answers "does this
  # cluster's public router sit behind Cloudflare", which is true for every
  # route on that router or for none of them.
  #
  # Off by default. Turning it on is a PREREQUISITE for restricting the public
  # router's load balancer to Cloudflare's ranges, not a consequence of it:
  # proxy first, verify, then restrict. Restricting while a route is still
  # DNS-only leaves it resolving to an address that refuses the connection.
  #
  # ⚠️ Two Cloudflare edge limits apply the moment this is on, and neither is
  # visible until something hits them:
  #   * origin timeout is 100s on Free/Pro (524 after that), regardless of the
  #     haproxy.router.openshift.io/timeout the route asks for;
  #   * request bodies are capped at 100 MB on Free/Pro.
  # Both are raisable only on Enterprise. A service needing long requests or
  # large uploads cannot be external on a proxied cluster without that.
  cloudflareProxied: false
  certIssuer:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
kanidm:
  enabled: false
  hostname: sso.voicd.ai
  logLevel: info
  image:
    repository: image-registry.openshift-image-registry.svc:5000/voicdops-images/kanidm
    tag: v1.11.0-adminui.2
    pullPolicy: Always
  pvc:
    size: 10Gi
    storageClass: ibmc-vpc-block-10iops-tier
  # Readiness path (ARCH-576). Readiness decides whether a pod joins the `kanidm`
  # Service, and /status answers 200 on a node that is running but holds an EMPTY
  # database — so a scaled-out replica takes SSO traffic ~15s after boot, before
  # the cert exchange has run.
  #
  # Leave this at /status for normal operation and for any FIRST install: a fresh
  # deployment has no OAuth2 clients, so a data-aware path would never answer 200
  # and the pod would never become Ready.
  #
  # For a scale-out of an already-populated cluster, set it to a path that only
  # answers 200 once the node holds data, e.g.
  #   /oauth2/openid/openshift/.well-known/openid-configuration
  # which keeps the new replica out of the Service until replication has synced,
  # then put it back. See Module_Kanidm, "Scaling replicas in and out".
  # Readiness decides Service membership, and /status answers 200 on a running but
  # EMPTY node — so a scaled-out replica takes SSO traffic ~15s after boot, before
  # its certs are exchanged. Point this at a data-aware path (e.g.
  # /oauth2/openid/openshift/.well-known/openid-configuration) for the duration of a
  # scale-out to keep an unsynced replica out of the Service, then put it back.
  #
  # It MUST be /status at rest. Two reasons: a first install has no OAuth2 clients,
  # so a data-aware path never answers 200 and no pod ever becomes Ready; and with
  # podManagementPolicy OrderedReady a permanently-unready highest ordinal blocks
  # every rolling update to the pods below it (ARCH-578).
  readinessPath: /status
  # ARCH-576: limits doubled from 1 CPU / 512Mi. A replication refresh pulls and
  # applies the full database in one go, and a mesh node also serves live auth
  # while replicating incrementally with every peer — both spike well above steady
  # state. Requests are unchanged: they drive scheduling, and the steady-state
  # footprint has not moved.
  #
  # A too-low CPU limit is the more dangerous half. Throttling stretches the work
  # that allocates, so transient memory outruns GC and the container OOMs at a
  # limit its steady state sits comfortably under — see ARCH-574, where kuadrant
  # died repeatedly at 300Mi and then settled at 142 MiB once CPU was raised.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 1Gi
  certIssuer:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  backup:
    enabled: true
    schedule: '@daily'
    versions: 7
  # ARCH-576: 3 replicas, one per AZ, so SSO survives losing a zone. The ARCH-571
  # zone spread (maxSkew 1 on topology.kubernetes.io/zone) does the placing —
  # us-east-2 holds none today, so kanidm-2 lands there.
  #
  # Scaling this is a procedure, not a dial: the new node boots with an empty
  # database and needs the cert exchange run across all three before it holds
  # data. See Module_Kanidm, "Scaling replicas in and out".
  replicas: 3
  replication:
    enabled: false
    # ARCH-578: keeps kanidm-repl-certs in step with the running nodes so replicas
    # can be scaled in and out without anyone running the cert exchange by hand.
    # Reads every node's replication cert, and only acts when the set actually
    # changes — a node's cert comes from its on-disk identity and is stable across
    # restarts, so a healthy cluster is a no-op and there is no restart loop.
    # Fails closed: an unreachable node leaves the ConfigMap untouched rather than
    # publishing a partial set that would drop a partner block on next restart.
    certReconciler:
      enabled: true
      schedule: '*/5 * * * *'
      # The cluster-provided oc image; always present, no external pull.
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  cosBackup:
    enabled: false
    bucket: voicd-kanidm-backups
    endpoint: https://s3.direct.us-east.cloud-object-storage.appdomain.cloud
    region: us-east
    image: amazon/aws-cli:latest
    intervalSeconds: 3600
    secretName: kanidm-cos-backup
  route:
    timeout: 60s
  publicLoadBalancer:
    enabled: false
    ipType: public
  # ARCH-567: peers kanidmd may believe an X-Forwarded-For header from. Empty
  # means kanidmd uses the socket peer, which behind the public LB is always a
  # SNAT address (100.64.0.0/10) and tells you nothing about the caller.
  #
  # Set to ["100.64.0.0/10"] to read Cloudflare's forwarded client address —
  # but ONLY once the LB is restricted to Cloudflare's ranges by a security
  # group in voicd-terraform. Until then anyone who can reach the LB can forge
  # the address kanidmd keys rate limiting and lockout on. Deliberately not a
  # list of Cloudflare ranges: trust is evaluated against the immediate peer,
  # and the peer is the load balancer, never Cloudflare.
  trustedProxyRanges: []
