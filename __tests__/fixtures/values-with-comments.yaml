      socketPath: /shared/ipc/datavault.sock
      args:
        - '--ipc-mode'
        - '--ipc-socket-path'
        - /shared/ipc/datavault.sock
        - '--filestore-base-path'
        - /app/filestore
        - '--filestore-vault-dir'
        - vault
        - '--filestore-temp-dir'
        - /app/filestore/tmp
    queuebroker:
